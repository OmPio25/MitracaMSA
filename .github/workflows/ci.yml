name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Code Quality & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Next.js Production Build Test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mitracamsa_ci"
          JWT_SECRET: "ci_jwt_secret_minimum_32_characters_for_build"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
